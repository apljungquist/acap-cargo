[workspace]
members = [
    "crates/*",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.86"
clap = "4.5.1"
clap_complete = "4.5.2"
diqwest = "=3.1.0"
digest_auth = "0.3.1"
dirs = "5.0.1"
env_logger = { version = "0.11.3", default-features = false }
futures-util = "0.3.30"
flate2 = "1.0.30"
glob = "0.3.1"
log = "0.4.22"
regex = "1.7.2"
reqwest = { version = "0.12.5", default-features = false }
reqwest-websocket = "0.4.1"
semver = "1.0.23"
serde = "1.0.204"
serde_json = "1.0.120"
tar = "0.4.40"
tempdir = "0.3.7"
tempfile = "3.10.1"
tokio = "1.38.1"
url = "2.5.2"

acap-build = { path = "crates/acap-build" }
acap-ssh-utils = { path = "crates/acap-ssh-utils" }
acap-vapix = { path = "crates/acap-vapix" }
cargo-acap-build = { path = "crates/cargo-acap-build" }
cli-version = { path = "crates/cli-version" }

[workspace.package]
edition = "2021"
